<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<div id="if_root" class="if_dark-ui">
  <section aria-label="CinterForge asset view" id="objaverse-browser">
    <div id="objaverse-results"></div>
  </section>
  <div id="asset-terminal-status" role="status"></div>
  <div id="bottom-response" role="status"></div>
</div>
<script>
window.CINTERFORGE_IF_ASSET_WORKSPACE=true;
window.CINTERFORGE_ASSET_VIEW_UCI=new URLSearchParams(location.search).get('uci')||'';
window.CINTERFORGE_IF_AUTHORING_BASE=window.location.origin;
window.CINTERFORGE_IF_ASSETS_PUBLIC_BASE_URL=window.location.origin+'/assets-library/SVG/Assets';
window.CINTERFORGE_IF_HOST_BASE=window.location.origin;
window.CINTERFORGE_IF_LOCAL_WORLD_ACTIVE=false;
window.CINTERFORGE_IF_RESOURCE_ONLY=false;
window.CINTERFORGE_IFPLAYER_PRESENTATION_BASE=window.location.origin+'/assets-library/';
const ifRootElement=document.getElementById('if_root');
function ifGetElementById(id){return id==='if_root'?ifRootElement:ifRootElement.querySelector('#'+id);}
function ifQuerySelector(selector){return ifRootElement.querySelector(selector);}
function ifQuerySelectorAll(selector){return ifRootElement.querySelectorAll(selector);}
function uiString(key,fallback){return fallback;}
async function ensureBabylon(){if(!window.BABYLON)throw new Error('Staged original Babylon runtime missing');}
</script><script src="/assets-library/vendor/babylon.js"></script><script src="/assets-library/vendor/babylonjs.loaders.min.js"></script><script src="/babylon/9.26.1/babylon.gui.min.js"></script><script src="/babylon/9.26.1/babylonjs.materials.min.js"></script><script src="/babylon/9.26.1/babylonjs.serializers.min.js"></script><script src="/client/CinterForgeRuntime.js"></script><script src="/client/asset/CIFAsset.js"></script><script src="/client/asset/CIFAssetLibrary.js"></script><script src="/client/asset/CIFAssetDownload.js"></script><script src="/client/asset/CIFAssetPreview.js"></script><script src="/client/asset/CIFAssetThumbnail.js"></script><script src="/client/asset/CIFAssetAssignment.js"></script><script src="/client/asset/CIFAssetObjaverse.js"></script><script src="/client/asset/CIFAssetPD12M.js"></script><script src="/client/asset/CIFAssetMixamo.js"></script><script src="/client/asset/CIFAssetCloudflare.js"></script><script src="/client/asset/CIFGltf21ExternalAssets.js"></script><script src="/client/minecraft/CinterForgeVoxelLib.js"></script><script src="/client/minecraft/CIFBlockify.js"></script><script src="/client/minecraft/CIFBlockifyPreview.js"></script><script src="/client/minecraft/CIFBlockifyBatch.js"></script><script src="/client/minecraft/CIFBlockifyMinecraftServer.js"></script><script src="/client/asset/CIFAssetEditor.js"></script><script src="/client/asset/CIFAssetBrowser.js"></script><script>
(async()=>{
 const status=document.getElementById('asset-terminal-status');
 const packResultsUrl='/assets-library/SVG/Assets/MCAddons/index.html';
 const reportUrl='/assets-library/SVG/Assets/AssetGallery.html';
 const returnToReport=()=>{
   if(window.parent!==window) window.parent.postMessage({type:'cinterforge-assets-open-report'},location.origin);
   else window.location.replace(reportUrl);
 };
 const showBlockifyFailure=message=>{
   // A failed CSV job must not fall through to the unrelated saved-asset
   // gallery. Use the existing main workspace area, not another status bar.
   const browser=document.getElementById('objaverse-browser');
   const content=document.createElement('section');
   content.setAttribute('role','alert');
   content.style.cssText='box-sizing:border-box;padding:24px;max-width:100%;height:100%;overflow:auto;white-space:pre-wrap;font:13px/1.5 monospace;color:#ffe8e8;background:#171b22';
   content.textContent='Blockify CSV migration failed. No completed pack viewer is available.\n\n'+String(message||'Unknown error');
   browser.replaceChildren(content);
 };
 try{
   await window.CINTERFORGE_IF_HOST_API_INIT;
   if(window.CINTERFORGE_IF_HOST_API_READY!==true)throw new Error('Original IFPlayer authoring host not ready');
   const query=new URLSearchParams(location.search);
   const uci=query.get('uci');
   if(!uci&&!query.get('job')){returnToReport();return;}
   const job=query.get('job');
   if(job&&!uci)document.documentElement.classList.add('asset-batch-running');
   // Import is not complete when the source GLB is saved. The original
   // migration must run before the interactive browser initializes its saved
   // preview renderers, which compete for the same WebGL context and can fail
   // independently of the canonical export. Keep the editor unavailable until
   // the migration has reported its result to the Terminal job API.
   let migrationComplete=!job;
   let migrationFailure='';
   const runMigrationJob=async()=>{
     if(!job)return;
     const response=await fetch('/api/assets/blockify/job/'+encodeURIComponent(job),{cache:'no-store'});
     if(!response.ok)throw new Error('Blockify job not found');
     const payload=await response.json();
     let done=0, failed=0;
     const progress=async(message,finished=false)=>{
       const response=await fetch('/api/assets/blockify/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job,processed:done+failed,failed,message,finished})});
       if(!response.ok)throw new Error('Unable to update Terminal Blockify progress: '+response.status);
     };
     await progress('Blockify started');
     const rows=payload.rows;
     const write=message=>{status.textContent=(status.textContent+'\n'+String(message)).slice(-10000);console.info('[assets blockify]',message);};
     let reused=0;
     const failureMessages=[];
     try{
       for(const row of rows){
         try{
           if(row.reuse_completed){
             // Original Server completeness/recipe check elected this UCI for
             // reuse. Rehydrate its themed-pack staging with the ORIGINAL
             // migration action; never run a second voxelizer over authored edits.
             await CIFRuntime.assetCommand({operation:'asset-migration-stage-existing',...row});
             reused++;
             write('Reused complete UCI · '+row.uci+' · '+row.name);
           }else{
             // The original migration is inherited by CIFAssetBrowser. Invoke it
             // on that class so its rig-name, preview and animation helpers
             // resolve on `this` for both CSV batches and imported GLBs.
             await CIFAssetBrowser.MigrateCatalogAsset(row,rows,write);
           }
           done++;
         }catch(error){
           failed++;
           const failure='FAIL '+row.uci+': '+String(error?.stack||error?.message||error);
           failureMessages.push(failure);
           write(failure);
         }
         write('Processed '+(done+failed)+'/'+rows.length+' · '+reused+' reused');
         await progress('Processed '+(done+failed)+'/'+rows.length+' · '+reused+' reused');
       }
     }finally{
       // The engine is retained on the class that ran migration. Release
       // that same instance after the complete CSV/import job.
       CIFAssetBrowser.DisposeMigrationEngine();
     }
     let assemblyError='';
     if(failed===0&&payload.assemble_packs){
       try{
         // An interrupted older batch may have unrelated staged assets. Do
         // not silently include them or call the destructive pack-reset action.
         const staged=await CIFRuntime.assetCommand({operation:'asset-migration-pack-staging-status'});
         const expected=new Set(rows.filter(row=>Number(row.blockify_resolution||0)>0&&row.pack_name).map(row=>row.uci));
         const actual=new Set(staged.staged_ucis||[]);
         const missing=[...expected].filter(uci=>!actual.has(uci));
         const stale=[...actual].filter(uci=>!expected.has(uci));
         if(missing.length||stale.length)throw new Error('Pack staging differs from CSV; missing UCI: '+missing.slice(0,5).join(', ')+'; unrelated UCI: '+stale.slice(0,5).join(', ')+'. Preserving staged data for reconciliation.');
         const built=await CIFRuntime.assetCommand({operation:'asset-migration-build-packs'});
         const expectedByPack=new Map();
         for(const row of rows){
           if(Number(row.blockify_resolution||0)<=0||!row.pack_name)continue;
           expectedByPack.set(row.pack_name,(expectedByPack.get(row.pack_name)||0)+1);
         }
         const actualByPack=new Map((built.packs||[]).map(entry=>[entry.name,Number(entry.assets||0)]));
         for(const [name,count] of expectedByPack){
           if(name==='Unassigned'){
             // Unassigned is a staging/review collection, not a CSV-sized
             // authored theme. Additional staged assets are valid here.
             if(!actualByPack.has(name))throw new Error('Themed Minecraft pack is missing: Unassigned');
             if(actualByPack.get(name)!==count)write('Unassigned catch-all: '+actualByPack.get(name)+' staged assets; '+count+' listed in CSV (count is not fixed)');
             continue;
           }
           if(actualByPack.get(name)!==count)throw new Error('Themed Minecraft pack is incomplete: '+name+' expected '+count+' assets, got '+(actualByPack.get(name)??'missing'));
         }
         if(actualByPack.size!==expectedByPack.size)throw new Error('Unexpected themed Minecraft pack produced; preserve staged data for reconciliation.');
         const packagedAssets=[...actualByPack.values()].reduce((sum,count)=>sum+count,0);
         write('Original Minecraft pack builder completed · '+built.count+' themed packs · '+packagedAssets+' staged assets ('+expected.size+' unique CSV assets)');
         // These are separately authored ORIGINAL Server/Converter operations:
         // themed pack art, WebGL previews, index.html, and the full Assets
         // gallery. The previous Terminal adapter silently skipped both.
         const galleries=await CIFRuntime.assetCommand({operation:'asset-migration-pack-galleries'});
         if(Number(galleries.assets)!==packagedAssets)throw new Error('Pack galleries omitted staged assets: '+galleries.assets+' of '+packagedAssets);
         write('Original pack galleries generated · '+galleries.packs+' pages · '+galleries.assets+' asset previews');
         if((galleries.missing_artwork||[]).length)
           write('Pack artwork was not supplied (HTML still generated): '+galleries.missing_artwork.join(', '));
         // Verify that the finished artifact is actually accessible through
         // Terminal's established same-origin Assets route before reporting
         // success or switching the user's tab to it.
         const viewer=await fetch(packResultsUrl,{cache:'no-store'});
         if(!viewer.ok)throw new Error('Generated Minecraft pack index is not served at '+packResultsUrl+' (HTTP '+viewer.status+')');
         const report=await CIFRuntime.assetCommand({operation:'asset-migration-gallery'});
         if(!report.path||Number(report.count)<=0)throw new Error('Original Converter AssetGallery was not written');
         write('Original Assets report generated · '+report.count+' UCI assets · '+report.path);
       }catch(error){
         // Safari's Error.stack may contain *only* call sites. Always retain
         // the HTTP server's actual error.message, then the optional stack.
         const detail=String(error?.message||error);
         assemblyError=detail+(error?.stack&&String(error.stack)!==detail?'\n'+String(error.stack):'');
         write('Complete pipeline failed: '+assemblyError);
       }
     }
     write('Blockify finished: '+done+' complete, '+reused+' reused, '+failed+' failed'+(assemblyError?' · packaging/gallery FAILED':''));
     if(assemblyError){
       const response=await fetch('/api/assets/blockify/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job,processed:done+failed,failed,error:assemblyError})});
       if(!response.ok)throw new Error('Unable to report Minecraft Pack/Asset gallery failure');
     }else if(failed){
       const message='Original asset migration failed: '+failed+' of '+rows.length+' assets. '+failureMessages.join(' | ');
       const response=await fetch('/api/assets/blockify/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job,processed:done+failed,failed,error:message})});
       if(!response.ok)throw new Error('Unable to report original asset migration failure');
     }else await progress('Blockify finished: '+done+' complete, '+reused+' reused, '+failed+' failed.',true);
     migrationComplete=failed===0&&!assemblyError;
     migrationFailure=assemblyError||failureMessages.join(' | ');
   };
   // Imported source-only UCIs have priority over preview initialization.
   // Explicit batch/CSV jobs keep their established browser-first lifecycle.
   if(job&&uci)await runMigrationJob();
   if(uci){
     const payload=await CIFRuntime.assetCommand({operation:'saved-list'});
     const groups=payload?.groups||{};
     // A single asset view must use the authoritative Server category, not
     // fall back to an entire library category if the UCI has been removed.
     const categories=[
       {name:'Images',rows:groups.Images||[]},
       {name:'Objects',rows:groups.Objects||[]},
       {name:'Animated',animated:'Mixamo',rows:groups.Animated?.Mixamo||[]},
       {name:'Animated',animated:'Fixed',rows:groups.Animated?.Fixed||[]},
       {name:'Animations',rows:groups.Animations||[]}
     ];
     const category=categories.find(item=>item.rows.some(row=>row.uci===uci));
     if(!category)throw new Error('UCI not present in saved library: '+uci);
     const match=category.rows.find(row=>row.uci===uci);
     CIFAssetBrowser.savedCategory=category.name;
     if(category.animated)CIFAssetBrowser.savedAnimated=category.animated;
     CIFAssetBrowser.mode='saved';
     await CIFAssetBrowser.Initialize();
     CIFAssetBrowser.ResumeRendering();
     await CIFAssetBrowser.LoadSaved();
     const card=[...document.querySelectorAll('.saved-asset-card')].find(el=>el.dataset.folder===match.folder);
     if(!card)throw new Error('Saved asset UCI was not rendered: '+uci);
     // Original saved-asset card owns preview, Blockify, Voxel, Export and Remove.
     CIFAssetBrowser.ToggleSavedMinecraftFullView(card,true);
     if(migrationComplete){
       try{await CIFAssetBrowser.LoadSavedPreview(card);}
       catch(error){status.textContent='Preview unavailable: '+String(error.message||error);document.documentElement.classList.add('asset-view-error');}
     }
     CIFAssetBrowser.SetProgress(card,'UCI: '+uci+(job?
       (migrationComplete?' · Original migration complete':' · Migration failed'):' · Asset View'));
     if(job&&!migrationComplete){
       status.textContent='Original migration failed:\n'+migrationFailure;
       document.documentElement.classList.add('asset-view-error');
     }
   }
   if(job&&!uci){
     await runMigrationJob();
     if(migrationComplete){
       // The entire CSV pipeline (including pack index, galleries, and the
       // canonical Assets report) has passed. Open the generated Assets Report tab and close this conversion tab.
       returnToReport();
     }else{
       showBlockifyFailure(migrationFailure);
     }
   }
 }catch(error){
   if(new URLSearchParams(location.search).get('job')&&!new URLSearchParams(location.search).get('uci'))
     showBlockifyFailure(error?.stack||error?.message||error);
   status.textContent='Asset View error: '+(error.stack||error.message||error);
   document.documentElement.classList.add('asset-view-error');
   console.error(error);
   const job=new URLSearchParams(location.search).get('job');
   if(job){try{await fetch('/api/assets/blockify/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job,processed:0,failed:0,error:String(error?.stack||error)})});}catch(_){}}
 }
})();
</script></body></html>
